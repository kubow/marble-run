name: Android APK

# Builds the debug APK on every push/PR to main (downloadable as a workflow
# artifact) and attaches it to a GitHub Release when a tag like v0.2.0 is pushed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases on tags

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BIN: /home/runner/godot/godot

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Install Godot and Android export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p /tmp/godot-dl && cd /tmp/godot-dl
          curl -sSfLO "$BASE/SHA512-SUMS.txt"
          curl -sSfLO "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSfLO "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          grep -E " Godot_v${GODOT_VERSION}-stable_(linux\.x86_64\.zip|export_templates\.tpz)$" SHA512-SUMS.txt | sha512sum -c
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mkdir -p ~/godot
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$GODOT_BIN"
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          unzip -q -o "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" 'templates/android*' 'templates/version.txt'
          cp templates/* "$T"/
          rm -rf /tmp/godot-dl

      - name: Configure Godot editor settings (SDK + Java paths)
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          "$GODOT_BIN" --version

      - name: Run tests
        run: GODOT="$GODOT_BIN" tools/run_tests.sh

      - name: Use stable debug keystore (optional secret)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          # Without this secret a fresh key is generated each run, and Android
          # refuses to update an installed build signed with a different key.
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Set version code (run number) and version name (tag)
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            sed -i "s/^version\/name=.*/version\/name=\"$VER\"/" export_presets.cfg
            sed -i "s/^config\/version=.*/config\/version=\"$VER\"/" project.godot
          fi
          grep -E "^version/(code|name)=" export_presets.cfg

      - name: Build debug APK
        run: GODOT="$GODOT_BIN" tools/build_android.sh debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: marble-run-debug-apk
          path: builds/marble-run-debug.apk
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: builds/test_results.txt
          if-no-files-found: ignore

      - name: Name APK after the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp builds/marble-run-debug.apk "builds/marble-run-${GITHUB_REF_NAME}.apk"

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: builds/marble-run-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Install on Android
            1. Open this page on the phone and download `marble-run-${{ github.ref_name }}.apk`.
            2. Open the file and allow installing apps from this source when asked.
            3. Updating: install over the previous version (same signing key).

            Debug-signed build for arm64 Android devices; no permissions requested, works fully offline.
